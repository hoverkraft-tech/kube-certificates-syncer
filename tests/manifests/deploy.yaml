---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: certs-syncer
  namespace: certs-syncer
  annotations:
    checkov.io/skip1:
      CKV_K8S_8=The watch worker has no health endpoint. Kubernetes
      restarts its main process on exit.
    checkov.io/skip2:
      CKV_K8S_9=This background worker is not a Service backend and
      has no readiness endpoint.
    checkov.io/skip3:
      CKV_K8S_38=The worker requires its service account token to
      watch the Kubernetes API.
spec:
  selector:
    matchLabels:
      app: certs-syncer
  template:
    metadata:
      labels:
        app: certs-syncer
    spec:
      containers:
        - name: certs-syncer
          image: docker.io/webofmars/certs-syncer:0.2.1@sha256:fa7516831c21e34194f52b82ea9c46f22d512bab99fb81a3f1717fbd0abbe3c9
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            limits:
              memory: 128Mi
              cpu: 500m
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: certs
              mountPath: /certs
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          imagePullPolicy: Always
      volumes:
        - name: config
          configMap:
            name: certs-syncer
        - name: certs
          persistentVolumeClaim:
            claimName: certs
      serviceAccountName: certs-syncer
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
