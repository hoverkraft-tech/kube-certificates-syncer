---
apiVersion: v1
kind: ConfigMap
metadata:
  name: certs-syncer
  namespace: certs-syncer
data:
  config.yaml:
    "filter:\n  annotations:\n    certificate-syncer-enabled: \"true\"\n\
    \    certificate-syncer-dryRun: \"false\"\nremap:\n  - name: tls.crt\n    value:\
    \ '{{secretName}}.crt'\n  - name: tls.key\n    value: '{{secretName}}.crt.key'\n"
