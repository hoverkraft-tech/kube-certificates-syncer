[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "kube-certificates-syncer"
version = "0.0.0"
description = "Synchronize annotated Kubernetes secrets to certificate files"
requires-python = ">=3.12"
dependencies = [
  "kubernetes>=29,<30",
  "PyYAML>=6.0.1,<7",
]

[dependency-groups]
dev = [
  "black>=26.10.1",
  "kubernetes-stubs==22.6.0.post1",
  "mypy>=2.4.1",
  "pytest>=9.2.0",
  "pytest-cov>=7.1.0",
  "ruff>=0.17.6",
  "types-PyYAML>=6.0.12",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["src", "typings"]
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["kube_certificates_syncer"]
branch = true
