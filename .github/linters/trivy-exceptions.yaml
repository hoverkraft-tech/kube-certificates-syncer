---
misconfigurations:
  - id: DS-0026
    paths:
      - Dockerfile
    statement:
      This Kubernetes watch worker has no health endpoint; Kubernetes restarts
      it when its main process exits.
  - id: KSV-0113
    paths:
      - tests/manifests/role.yaml
    statement:
      Reading Secrets in its namespace is the syncer purpose. The Role grants
      only list and watch, with no mutations.
