---
name: Internal - Shared continuous integration

on:
  workflow_call:

permissions: {}

jobs:
  lint:
    name: Repository quality
    uses: hoverkraft-tech/ci-github-common/.github/workflows/linter.yml@af0bdd6313bd49aaf4a8a7f0de005fb0db856b03 # 4.3.3
    permissions:
      actions: read
      contents: read
      issues: write
      packages: read
      pull-requests: write
      security-events: write
      statuses: write
    with:
      comment: false
      # Keep the repository-managed CodeQL default setup for Python.
      codeql-languages: ""
      lint-all: true
      python-linter-toolchain: black
      linter-env: |
        IGNORE_GITIGNORED_FILES=true
        LOG_LEVEL=INFO
        PYTHON_BLACK_CONFIG_FILE=../../pyproject.toml
        PYTHON_ISORT_CONFIG_FILE=../../pyproject.toml

  test:
    name: Python Continuous Integration
    uses: hoverkraft-tech/ci-github-python/.github/workflows/continuous-integration.yml@9fe07ffb0ede25d9311ca9e3d8c82d1ce38e7d75 # 0.0.1
    permissions:
      contents: read
      id-token: write

  container:
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Docker tooling
        id: docker
        uses: hoverkraft-tech/ci-github-container/actions/docker/setup@b055d6ce0f3a5e223615ad494d88d92e17af11e5 # 4.2.0
        with:
          oci-registry-username: ${{ github.actor }}
          oci-registry-password: ${{ github.token }}
      - name: Build the locked production environment
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          builder: ${{ steps.docker.outputs.buildx-name }}
          context: .
          load: true
          push: false
          tags: kube-certificates-syncer:ci
      - name: Check the non-root runtime and certificate volume
        run: |
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /certs:uid=10001,gid=10001,mode=0700 \
            --entrypoint python kube-certificates-syncer:ci -I -c '
          import os
          from pathlib import Path
          import kube_certificates_syncer.main
          assert os.getuid() == 10001
          Path("/certs/smoke").write_text("ok")
          '

  reports:
    if: ${{ !cancelled() }}
    needs: [lint, test]
    uses: hoverkraft-tech/ci-github-common/.github/workflows/ci-reports.yml@af0bdd6313bd49aaf4a8a7f0de005fb0db856b03 # 4.3.3
    permissions:
      contents: read
      pull-requests: write
    with:
      job-results: ${{ toJSON(needs) }}
