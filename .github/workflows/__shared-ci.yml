---
name: Internal - Shared continuous integration

on:
  workflow_call:

permissions: {}

jobs:
  lint:
    name: Repository quality
    uses: hoverkraft-tech/ci-github-common/.github/workflows/linter.yml@ea5900049a1704d6d2b479cc6cce37e799f532a3 # PR #683 (unreleased)
    permissions:
      actions: read
      contents: read
      issues: write
      packages: read
      pull-requests: write
      security-events: write
      statuses: write
    with:
      # Keep the repository-managed CodeQL default setup for Python.
      codeql-languages: ""
      lint-all: true
      python-linter-toolchain: black
      linter-env: |
        IGNORE_GITIGNORED_FILES=true
        LOG_LEVEL=INFO
        PYTHON_BLACK_CONFIG_FILE=../../pyproject.toml
        PYTHON_ISORT_CONFIG_FILE=../../pyproject.toml

  test:
    name: Python Continuous Integration
    # Use .python-version, aligned with the production Dockerfile.
    uses: hoverkraft-tech/ci-github-python/.github/workflows/continuous-integration.yml@c257ef9b192b01b7e4eaa84be41ce8a7599bff33 # PR #11 (unreleased)
    permissions:
      actions: read
      contents: read

  container:
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Docker tooling
        id: docker
        uses: hoverkraft-tech/ci-github-container/actions/docker/setup@b055d6ce0f3a5e223615ad494d88d92e17af11e5 # 4.2.0
        with:
          oci-registry-username: ${{ github.actor }}
          oci-registry-password: ${{ github.token }}
      - name: Build the locked production environment
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          builder: ${{ steps.docker.outputs.buildx-name }}
          context: .
          load: true
          push: false
          tags: kube-certificates-syncer:ci
      - name: Test the production image
        # TODO: pin a release after https://github.com/hoverkraft-tech/ci-github-container/pull/1003.
        uses: hoverkraft-tech/ci-github-container/actions/docker/test-image@9263be4a86c8176d0a7cecc16aa135ccf64b06e1 # PR #1003 (unreleased)
        with:
          image: ${{ steps.image.outputs.imageid }}
          working-directory: tests/container-image

  reports:
    if: ${{ !cancelled() }}
    needs: [lint, test, container]
    uses: hoverkraft-tech/ci-github-common/.github/workflows/ci-reports.yml@ea5900049a1704d6d2b479cc6cce37e799f532a3 # PR #683 (unreleased)
    permissions:
      actions: read
      contents: read
      pull-requests: write
      code-quality: write
      id-token: write
      security-events: write
    with:
      job-results: ${{ toJSON(needs) }}
